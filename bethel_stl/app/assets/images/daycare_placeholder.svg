<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fef9c3"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="45" fill="#facc15"/>
  <g stroke="#facc15" stroke-width="4" fill="none">
    <line x1="520" y1="10" x2="520" y2="0"/>
    <line x1="520" y1="130" x2="520" y2="140"/>
    <line x1="460" y1="70" x2="450" y2="70"/>
    <line x1="580" y1="70" x2="590" y2="70"/>
    <line x1="478" y1="28" x2="471" y2="21"/>
    <line x1="562" y1="112" x2="569" y2="119"/>
    <line x1="478" y1="112" x2="471" y2="119"/>
    <line x1="562" y1="28" x2="569" y2="21"/>
  </g>

  <!-- Ground / grass -->
  <rect x="0" y="320" width="600" height="80" fill="#86efac"/>
  <ellipse cx="80" cy="320" rx="30" ry="8" fill="#4ade80"/>
  <ellipse cx="250" cy="325" rx="25" ry="6" fill="#4ade80"/>
  <ellipse cx="450" cy="318" rx="35" ry="7" fill="#4ade80"/>

  <!-- Building blocks -->
  <rect x="60" y="240" width="60" height="60" rx="4" fill="#f87171"/>
  <text x="90" y="278" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">A</text>

  <rect x="130" y="240" width="60" height="60" rx="4" fill="#60a5fa"/>
  <text x="160" y="278" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">B</text>

  <rect x="95" y="175" width="60" height="60" rx="4" fill="#4ade80"/>
  <text x="125" y="213" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">C</text>

  <!-- Crayon 1 -->
  <g transform="translate(380,180) rotate(15)">
    <rect x="0" y="20" width="20" height="80" rx="2" fill="#f87171"/>
    <polygon points="0,20 10,0 20,20" fill="#ef4444"/>
    <rect x="0" y="20" width="20" height="12" rx="1" fill="#fca5a5"/>
  </g>

  <!-- Crayon 2 -->
  <g transform="translate(410,190) rotate(-10)">
    <rect x="0" y="20" width="20" height="80" rx="2" fill="#60a5fa"/>
    <polygon points="0,20 10,0 20,20" fill="#3b82f6"/>
    <rect x="0" y="20" width="20" height="12" rx="1" fill="#93c5fd"/>
  </g>

  <!-- Crayon 3 -->
  <g transform="translate(440,185) rotate(5)">
    <rect x="0" y="20" width="20" height="80" rx="2" fill="#facc15"/>
    <polygon points="0,20 10,0 20,20" fill="#eab308"/>
    <rect x="0" y="20" width="20" height="12" rx="1" fill="#fde68a"/>
  </g>

  <!-- Stars scattered -->
  <polygon points="300,50 305,65 320,65 308,74 312,90 300,80 288,90 292,74 280,65 295,65" fill="#fb923c" opacity="0.7"/>
  <polygon points="170,80 173,88 182,88 175,93 177,102 170,96 163,102 165,93 158,88 167,88" fill="#c084fc" opacity="0.6"/>
  <polygon points="400,40 402,47 410,47 404,51 406,58 400,54 394,58 396,51 390,47 398,47" fill="#f87171" opacity="0.5"/>

  <!-- Smiley face -->
  <circle cx="300" cy="210" r="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="282" cy="198" r="6" fill="#78350f"/>
  <circle cx="318" cy="198" r="6" fill="#78350f"/>
  <path d="M278 225 Q300 248 322 225" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
